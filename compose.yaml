services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      API_ADDR: 0.0.0.0:8080
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      DATA_DIR: /data
      # Comma-separated host or host:port the API may connect to. Empty = disabled.
      ALLOWED_DB_HOSTS: ${ALLOWED_DB_HOSTS:-}
      DB_ALLOW_INSECURE: ${DB_ALLOW_INSECURE:-0}
      DB_TRUST_SERVER_CERT: ${DB_TRUST_SERVER_CERT:-0}
    volumes:
      - schema-data:/data
    expose:
      - "8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:?Set CF_TUNNEL_TOKEN in .env}
    depends_on:
      - api

volumes:
  schema-data:
